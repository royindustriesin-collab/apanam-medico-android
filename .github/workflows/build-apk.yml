name: Build Apanam Medico APK v5

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -q -o Apanam-Medico-Android-v1-source.zip

      - name: Fix Android theme
        run: |
          sed -i 's|android:style/Theme.Material.Light.NoActionBar|Theme.AppCompat.Light.NoActionBar|' ApanamMedicoAndroid/app/src/main/res/values/styles.xml

      - name: Fix mobile screen layout
        run: |
          python3 - <<'PY'
          path = "ApanamMedicoAndroid/app/src/main/java/com/apanammedico/app/MainActivity.java"
          text = open(path, encoding="utf-8").read()

          old = 's.setJavaScriptEnabled(true);'
          new = '''s.setJavaScriptEnabled(true);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  s.setTextZoom(100);
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);'''
          text = text.replace(old, new)

          old_finish = '@Override public void onPageFinished(WebView view, String url) { errorPanel.setVisibility(View.GONE); webView.setVisibility(View.VISIBLE); }'

          new_finish = '''@Override public void onPageFinished(WebView view, String url) {
                          errorPanel.setVisibility(View.GONE);
                          webView.setVisibility(View.VISIBLE);
                          view.evaluateJavascript("(function(){var m=document.querySelector('meta[name=viewport]');if(!m){m=document.createElement('meta');m.name='viewport';document.head.appendChild(m);}m.content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no';var s=document.createElement('style');s.innerHTML='html,body{width:100%!important;max-width:100%!important;overflow-x:hidden!important}img,video,iframe{max-width:100%!important;height:auto!important}';document.head.appendChild(s);})()", null);
                      }'''
          text = text.replace(old_finish, new_finish)

          open(path, "w", encoding="utf-8").write(text)
          PY

      - name: Enable microphone in Android WebView
        run: |
          python3 - <<'PY'
          manifest_path = "ApanamMedicoAndroid/app/src/main/AndroidManifest.xml"
          manifest = open(manifest_path, encoding="utf-8").read()

          internet_permission = '<uses-permission android:name="android.permission.INTERNET" />'
          microphone_permission = '<uses-permission android:name="android.permission.RECORD_AUDIO" />'

          if microphone_permission not in manifest:
              manifest = manifest.replace(
                  internet_permission,
                  internet_permission + "\n    " + microphone_permission
              )

          open(manifest_path, "w", encoding="utf-8").write(manifest)

          java_path = "ApanamMedicoAndroid/app/src/main/java/com/apanammedico/app/MainActivity.java"
          text = open(java_path, encoding="utf-8").read()

          javascript_marker = 's.setJavaScriptEnabled(true);'
          runtime_permission = '\n'.join([
              's.setJavaScriptEnabled(true);',
              '        if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.M &&',
              '                checkSelfPermission(android.Manifest.permission.RECORD_AUDIO)',
              '                        != android.content.pm.PackageManager.PERMISSION_GRANTED) {',
              '            requestPermissions(',
              '                    new String[]{android.Manifest.permission.RECORD_AUDIO},',
              '                    2001',
              '            );',
              '        }'
          ])

          text = text.replace(javascript_marker, runtime_permission)

          chrome_marker = '\n'.join([
              'webView.setWebChromeClient(new WebChromeClient() {',
              '            @Override public void onProgressChanged'
          ])

          chrome_replacement = '\n'.join([
              'webView.setWebChromeClient(new WebChromeClient() {',
              '            @Override public void onPermissionRequest(final android.webkit.PermissionRequest request) {',
              '                runOnUiThread(() -> {',
              '                    for (String resource : request.getResources()) {',
              '                        if (android.webkit.PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource)) {',
              '                            request.grant(new String[]{android.webkit.PermissionRequest.RESOURCE_AUDIO_CAPTURE});',
              '                            return;',
              '                        }',
              '                    }',
              '                    request.deny();',
              '                });',
              '            }',
              '            @Override public void onProgressChanged'
          ])

          text = text.replace(chrome_marker, chrome_replacement)

          open(java_path, "w", encoding="utf-8").write(text)
          PY

      - name: Apply final app icon
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

          for ITEM in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192
          do
            FOLDER="${ITEM%%:*}"
            SIZE="${ITEM##*:}"
            OUTPUT="ApanamMedicoAndroid/app/src/main/res/mipmap-${FOLDER}"

            convert app-icon.png2.png \
              -resize ${SIZE}x${SIZE}! \
              "$OUTPUT/ic_launcher.png"

            cp "$OUTPUT/ic_launcher.png" "$OUTPUT/ic_launcher_round.png"
          done

      - name: Fix duplicate Kotlin libraries
        run: |
          echo "configurations.configureEach { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'; exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' }" >> ApanamMedicoAndroid/app/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: ApanamMedicoAndroid
        run: gradle assembleDebug

      - name: Prepare APK
        run: cp ApanamMedicoAndroid/app/build/outputs/apk/debug/app-debug.apk Apanam-Medico-v5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Apanam-Medico-Android-App-v5
          path: Apanam-Medico-v5.apk
